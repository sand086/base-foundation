# Push a "qa" despliega QA; push a "main" despliega PROD. Ambos por SSH al servidor.
# Secrets requeridos (Settings > Environments > qa / prod):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS
# El environment "prod" debería tener "Required reviewers" para aprobar antes de desplegar.
name: Deploy

on:
  push:
    branches: [qa, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}
    # Un despliegue a la vez por ambiente; el siguiente espera, no se cancela uno en curso.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps: 
      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Desplegar
        run: |
          TARGET=${{ github.ref_name == 'main' && 'prod' || 'qa' }}
          DIR=${{ github.ref_name == 'main' && '/opt/app/3tapp' || '/opt/app/3tapp-qa' }}
          # El script se actualiza con el propio git pull, por eso se hace fetch antes de ejecutarlo.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd $DIR && git fetch origin ${{ github.ref_name }} && git checkout ${{ github.ref_name }} && git reset --hard origin/${{ github.ref_name }} && sh scripts/deploy.sh $TARGET"
